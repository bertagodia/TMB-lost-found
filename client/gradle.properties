org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# -----------------------------------------------------------------------------
# Configuració de l'app TMB Lost & Found
# Aquests valors es poden sobreescriure sense tocar el codi:
#   - a local.properties (no es puja a git), o
#   - per línia de comandes: ./gradlew assembleDebug -Plostfound.apiBaseUrl=https://...
# Vegeu docs/app-mobil/configuracio.md
# -----------------------------------------------------------------------------

# URL base de l'API del backend (ha d'acabar en /).
lostfound.apiBaseUrl=http://10.0.2.2:8000/api/
# true = s'utilitza l'API simulada (MockLostFoundApi) i no es fa cap crida de xarxa.
lostfound.useMockApi=true
