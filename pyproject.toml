[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmb-lost-found"
version = "0.1.0"
description = "Laboratorio de búsqueda textual y multimodal de objetos perdidos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=11.1,<13"]
vision = [
  "transformers==4.57.1",
  "torch>=2.6,<3",
  "Pillow>=11.1,<13",
  "sentencepiece>=0.2,<0.3",
]

[project.scripts]
lostfound = "lostfound.cli:main"

[tool.setuptools.packages.find]
include = ["lostfound*"]

[tool.setuptools.data-files]
"share/tmb-lost-found/web" = ["web/index.html", "web/app.js", "web/styles.css"]
"share/tmb-lost-found/data/demo" = ["data/demo/objects.json", "data/demo/queries.json"]
