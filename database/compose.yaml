services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tmb
      POSTGRES_USER: tmb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tmb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmb -d tmb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tmb_pgdata:
